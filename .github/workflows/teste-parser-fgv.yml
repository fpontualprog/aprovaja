name: Testes do parser FGV e upload Supabase

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/teste-parser-fgv.yml'

permissions:
  contents: read

jobs:
  testes-parser-e-upload:
    runs-on: ubuntu-24.04
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências dos testes
        run: python -m pip install pytest "supabase>=2.0.0,<3"
      - name: Validar sintaxe dos módulos
        run: python -m py_compile scripts/parser_fgv.py scripts/imagens.py scripts/validacao.py scripts/gabarito.py scripts/coletor.py scripts/upload_supabase.py
      - name: Listar testes coletados
        run: python -m pytest tests/ --collect-only -v

      - name: Executar testes unitários
        shell: bash
        run: |
          set +e
          python -m pytest tests/ -v --tb=short 2>&1 | tee pytest-report.txt
          test_status=${PIPESTATUS[0]}
          echo "$test_status" > pytest-exit-code.txt
          exit "$test_status"

      - name: Publicar relatório dos testes como artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-testes-parser-fgv
          path: |
            pytest-report.txt
            pytest-exit-code.txt
          if-no-files-found: warn
          retention-days: 14
