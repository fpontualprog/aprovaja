name: Testes do parser FGV

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes-parser:
    runs-on: ubuntu-24.04
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar pytest
        run: python -m pip install pytest
      - name: Validar sintaxe dos módulos
        run: python -m py_compile scripts/parser_fgv.py scripts/imagens.py scripts/validacao.py scripts/gabarito.py scripts/coletor.py
      - name: Executar testes unitários
        run: python -m pytest -q tests/test_parser_fgv.py
