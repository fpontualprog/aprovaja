name: Coleta diária de concursos PCI

on:
  schedule:
    # 07:15 em Recife (UTC-3), diariamente
    - cron: '15 10 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: coleta-diaria-pci
  cancel-in-progress: false

jobs:
  coletar-processar-publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependências
        run: python -m pip install -r requirements.txt

      - name: Testar proteção contra coleta parcial
        run: python coletor_pci.py --teste-protecao

      - name: Coletar concursos
        run: python coletor_pci.py

      - name: Validar estrutura dos dados coletados
        run: python validar_coleta.py

      - name: Processar base para o APROVAJÁ
        run: python processar_concursos.py

      - name: Preparar dados de publicação
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data
          cp resultado_coleta_pci_v3/concursos_pci_nordeste.json data/concursos_pci_origem.json
          cp resultado_coleta_pci_v3/concursos_pci_nordeste.csv data/concursos_pci_origem.csv
          cp resultado_coleta_pci_v3/processamento_aprovaja_local/concursos_elegiveis_aprovaja.json data/concursos_elegiveis.json
          cp resultado_coleta_pci_v3/processamento_aprovaja_local/concursos_elegiveis_aprovaja.csv data/concursos_elegiveis.csv
          cp resultado_coleta_pci_v3/processamento_aprovaja_local/historico_prazos_vencidos.json data/historico_prazos_vencidos.json
          cp resultado_coleta_pci_v3/processamento_aprovaja_local/historico_prazos_vencidos.csv data/historico_prazos_vencidos.csv
          cp resultado_coleta_pci_v3/processamento_aprovaja_local/excluidos_sem_data.json data/excluidos_sem_data.json
          cp resultado_coleta_pci_v3/processamento_aprovaja_local/relatorio_processamento.json data/relatorio_processamento.json
          cp resultado_coleta_pci_v3/relatorio_teste.json data/relatorio_coleta.json
          cp resultado_coleta_pci_v3/relatorio_validacao_qualidade.json data/relatorio_validacao_qualidade.json

      - name: Registrar atualização diária
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/*.json data/*.csv
          if git diff --cached --quiet; then
            echo "Os dados publicados não mudaram; nenhum commit necessário."
          else
            git commit -m "Atualiza dados de concursos PCI"
            git push
          fi
