name: Diagnóstico real do parser FGV b1102
# Reexecução controlada da inspeção completa v3 (90 questões).

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/validar_questoes_fgv.py"
      - "scripts/extrair_json_fgv.py"
      - "scripts/comparar_json_pdf.py"
      - "tests/test_validar_questoes_fgv.py"
      - ".github/workflows/debug-parser-fgv-real.yml"
  pull_request:
    paths:
      - "scripts/validar_questoes_fgv.py"
      - "scripts/extrair_json_fgv.py"
      - "tests/test_validar_questoes_fgv.py"
      - ".github/workflows/debug-parser-fgv-real.yml"

permissions:
  contents: read

jobs:
  diagnostico-fgv-real:
    runs-on: ubuntu-24.04
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: python -m pip install --upgrade pip "pymupdf>=1.24.0"

      - name: Testes unitários do validador
        run: python -m unittest tests.test_validar_questoes_fgv -v

      - name: Baixar prova oficial FGV b1102
        run: |
          curl --fail --location --retry 3 \
            "https://conhecimento.fgv.br/sites/default/files/concursos/b1102.pdf" \
            --output b1102.pdf
          file b1102.pdf
          test -s b1102.pdf

      - name: Extrair texto real do PDF
        run: |
          python - <<'PY'
          import pymupdf
          from pathlib import Path

          with pymupdf.open("b1102.pdf") as pdf:
              texto = "\n\n".join(
                  f"\n===== PÁGINA {i + 1} =====\n{pagina.get_text('text')}"
                  for i, pagina in enumerate(pdf)
              )
              print(f"PDF: {len(pdf)} páginas")
          Path("debug_b1102.txt").write_text(texto, encoding="utf-8")
          print(f"Texto extraído: {len(texto)} caracteres")
          print("\n--- INÍCIO DO TEXTO EXTRAÍDO ---")
          print(texto[:5000])
          if len(texto.strip()) < 1000:
              raise SystemExit("Extração insuficiente; verificar se o PDF exige OCR.")
          PY

      - name: Diagnóstico complementar do parser existente
        continue-on-error: true
        run: python scripts/teste_parser_local.py debug_b1102.txt --min-questoes 80

      - name: Validar estrutura das 90 questões
        run: python scripts/validar_questoes_fgv.py debug_b1102.txt --min-questoes 90

      - name: Gerar JSON para inspeção
        run: python scripts/extrair_json_fgv.py debug_b1102.txt --pdf b1102.pdf --saida saida_b1102.json

      - name: Validar JSON gerado
        run: python scripts/validar_questoes_fgv.py saida_b1102.json --json --min-questoes 90

      - name: Gerar relatório de inspeção da amostra
        run: |
          python scripts/comparar_json_pdf.py saida_b1102.json debug_b1102.txt --todas --todas-com-recursos --diff --registrar inspecao_amostra_v3.json > inspecao_amostra_v3.txt
          grep -E "Resumo:|similaridade aproximada < 90%" inspecao_amostra_v3.txt | tail -n 30
          echo "Diagnósticos normalizados encontrados: $(grep -c 'correspondência normalizada encontrada' inspecao_amostra_v3.txt || true)"
          echo "Campos não encontrados exatamente: $(grep -c 'NÃO ENCONTRADO EXATAMENTE' inspecao_amostra_v3.txt || true)"

      - name: Upload Supabase (bloqueado até homologação)
        if: vars.SUPABASE_UPLOAD_ENABLED == 'true'
        run: |
          echo "::error::SUPABASE_UPLOAD_ENABLED está true, mas o uploader ainda não foi homologado/configurado."
          echo "Nenhum dado foi enviado ao Supabase. Mantenha a variável ausente ou false."
          exit 1

      - name: Publicar JSON, texto e PDF para inspeção
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saida-parser-fgv-b1102
          path: |
            saida_b1102.json
            debug_b1102.txt
            inspecao_amostra_v3.txt
            inspecao_amostra_v3.json
            b1102.pdf
          if-no-files-found: warn
          retention-days: 14
