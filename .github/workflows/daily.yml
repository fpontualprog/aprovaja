name: APROVAJÁ — coleta legada de questões (manual)

on:
  # Agendamento automático desativado para evitar concorrência com pipeline-provas.yml.
  # Execute manualmente apenas quando precisar do evento PF_25_ADM.
  workflow_dispatch:

jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Rodar pipeline
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python -m scripts.run_single --evento PF_25_ADM
      - name: Salvar pasta data como artefato baixável
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coleta-PF_25_ADM
          path: data/
          if-no-files-found: warn
          retention-days: 14
