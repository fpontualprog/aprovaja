name: APROVAJÁ — coleta e sincronização de questões

on:
  workflow_dispatch:
  schedule:
    # Diário às 13h de Brasília (16h UTC).
    - cron: "0 16 * * *"

permissions:
  contents: read

concurrency:
  group: aprovaja-coleta-upload-questoes
  cancel-in-progress: false

jobs:
  coletar-e-enviar:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependências
        run: python -m pip install -r requirements.txt

      - name: Executar coleta e exportação do evento PF_25_ADM
        run: |
          python -c "from src.pipeline import processar_concurso; processar_concurso('PF_25_ADM', saida='data')"

      - name: Diagnosticar arquivos gerados em data/
        if: always()
        run: |
          echo "Diretório de trabalho: $PWD"
          if [ -d data ]; then
            echo "Arquivos em data/:"
            find data -maxdepth 3 -type f -printf '%p (%s bytes)\\n' | sort
            echo "CSVs encontrados:"
            find data -maxdepth 3 -type f -iname '*.csv' -print | sort
          else
            echo "::warning::A pasta data/ não foi criada."
          fi

      - name: Enviar CSVs ao Supabase com upsert (somente com habilitação explícita)
        if: ${{ vars.ENABLE_SUPABASE_UPLOAD == 'true' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/upload_supabase.py
