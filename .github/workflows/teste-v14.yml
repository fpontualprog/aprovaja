name: APROVAJÁ — teste unitário importar-questoes-pdf v14

on:
  push:
    paths:
      - ".github/workflows/teste-v14.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  teste-unitario:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Preparar teste único
        id: prep
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import hashlib, uuid, datetime
          marca = "github_v14_" + datetime.datetime.now(datetime.timezone.utc).strftime("%Y%m%dT%H%M%SZ") + "_" + uuid.uuid4().hex
          print("marca=" + marca)
          print("sha256=" + hashlib.sha256(marca.encode()).hexdigest())
          PY

      - name: Enviar exatamente um candidato de teste
        id: test
        env:
          APROVAJA_SUPABASE_URL: ${{ secrets.APROVAJA_SUPABASE_URL }}
          APROVAJA_IMPORT_SECRET: ${{ secrets.APROVAJA_IMPORT_SECRET }}
          MARCA: ${{ steps.prep.outputs.marca }}
          HASH: ${{ steps.prep.outputs.sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${APROVAJA_SUPABASE_URL:-}" || -z "${APROVAJA_IMPORT_SECRET:-}" ]]; then
            echo "::error::Faltam secrets APROVAJA_SUPABASE_URL e/ou APROVAJA_IMPORT_SECRET. Nenhuma requisição foi enviada."
            exit 2
          fi
          python - <<'PY'
          import json, os, urllib.request, urllib.error, sys
          base = os.environ["APROVAJA_SUPABASE_URL"].rstrip("/")
          if base.endswith("/"):
              base = base[:-1]
          if not base.startswith("https://"):
              raise SystemExit("APROVAJA_SUPABASE_URL precisa ser HTTPS.")
          url = base + "/functions/v1/importar-questoes-pdf"
          marca = os.environ["MARCA"]
          payload = {
            "batch": {
              "arquivo_sha256": os.environ["HASH"],
              "nome_arquivo": marca + ".pdf",
              "fonte": "github_actions_teste_unitario_v14",
              "url_fonte": ""
            },
            "items": [{
              "id_candidato": marca,
              "numero_detectado": "1",
              "pagina_inicio": 1,
              "pagina_fim": 1,
              "enunciado": "CANDIDATO FICTICIO DE TESTE GITHUB: qual alternativa e o gabarito definido para este teste de persistencia?",
              "disciplina": "Direito Administrativo",
              "tipo": "objetiva",
              "alternativas": {
                "A": "Alternativa A de teste",
                "B": "Alternativa B de teste",
                "C": "Alternativa C de teste",
                "D": "Alternativa D de teste",
                "E": "Alternativa E de teste"
              },
              "gabarito": "A",
              "confianca": "alta"
            }]
          }
          req = urllib.request.Request(
            url,
            data=json.dumps(payload, ensure_ascii=False).encode("utf-8"),
            headers={
              "Content-Type": "application/json",
              "x-aprovaja-import-secret": os.environ["APROVAJA_IMPORT_SECRET"],
              "User-Agent": "aprovaja-github-actions-v14-test"
            },
            method="POST"
          )
          status = None
          try:
            with urllib.request.urlopen(req, timeout=60) as resp:
              status = resp.status
              raw = resp.read().decode("utf-8", "replace")
          except urllib.error.HTTPError as e:
            status = e.code
            raw = e.read().decode("utf-8", "replace")
          try:
            body = json.loads(raw)
          except Exception:
            body = {"raw": raw}
          safe = {
            "marca": marca,
            "http_status": status,
            "trace_id": body.get("trace_id"),
            "lote_id": body.get("lote_id"),
            "resumo": body.get("resumo"),
            "persistencia": body.get("persistencia"),
            "resposta": body
          }
          with open("resultado-teste-v14.json", "w", encoding="utf-8") as f:
            json.dump(safe, f, ensure_ascii=False, indent=2)
          print(json.dumps(safe, ensure_ascii=False, indent=2))
          if status < 200 or status >= 300:
            raise SystemExit(f"Falha HTTP {status}; veja resposta e logs.")
          persist = body.get("persistencia") or {}
          summary = body.get("resumo") or {}
          if persist.get("verificada") is not True:
            raise SystemExit("FALSO SUCESSO: persistencia.verificada não é true.")
          if persist.get("atualizacao_lote_confirmada") is not True:
            raise SystemExit("FALSO SUCESSO: atualização do lote não foi confirmada.")
          if not isinstance(persist.get("itens_no_lote"), int) or persist["itens_no_lote"] < 1:
            raise SystemExit("FALSO SUCESSO: nenhum item foi confirmado no lote.")
          if summary.get("erros", 0) != 0:
            raise SystemExit("Falha: a resposta reportou erros.")
          print("PASSOU: resposta confirmou persistência do candidato na staging.")
          PY

      - name: Salvar resultado como artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: teste-v14-resultado-${{ github.run_id }}
          path: resultado-teste-v14.json
          if-no-files-found: warn
          retention-days: 14
