name: APROVAJÁ — coleta a cada 3 dias e alimentação do banco de questões

on:
  workflow_dispatch:
    inputs:
      max_downloads:
        description: "Máximo de PDFs processados nesta execução"
        required: true
        default: "8"
        type: string
      usar_ia:
        description: "Usar créditos de IA nesta execução manual"
        required: true
        default: true
        type: boolean
  schedule:
    # Execução a cada 3 dias, às 13:00 de Brasília (16:00 UTC).
    - cron: "0 16 */3 * *"

permissions:
  contents: read

concurrency:
  group: pipeline-provas-pdf-json
  cancel-in-progress: false

jobs:
  coletar-e-converter:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-provas.txt

      - name: Instalar dependências
        run: python -m pip install -r requirements-provas.txt

      - name: Validar sintaxe
        run: python -m py_compile provas_pipeline.py segmentar_questoes_candidatas.py validar_pdf_prova.py publicar_questoes_supabase.py enriquecer_questoes_ia.py vincular_gabaritos_ia.py buscar_gabaritos_web.py

      - name: Coletar até 8 PDFs, fazer triagem DeepSeek e gerar JSON multimodal
        env:
          DEEPSEEK_API_PUBLICA: ${{ secrets.DEEPSEEK_API_KEY }}
          APROVAJA_IA_MODEL: deepseek-flash
        run: python provas_pipeline.py --max-downloads "${{ inputs.max_downloads || '8' }}" --max-pages 100

      - name: Gerar lote de questões candidatas para revisão
        if: success()
        run: python segmentar_questoes_candidatas.py

      - name: Enriquecer questões com IA DeepSeek
        if: success() && (github.event_name == 'schedule' || inputs.usar_ia == true)
        env:
          DEEPSEEK_API_PUBLICA: ${{ secrets.DEEPSEEK_API_KEY }}
          APROVAJA_IA_MODEL: deepseek-flash
        run: python enriquecer_questoes_ia.py

      - name: Extrair gabaritos locais com IA DeepSeek
        if: success() && (github.event_name == 'schedule' || inputs.usar_ia == true)
        env:
          DEEPSEEK_API_PUBLICA: ${{ secrets.DEEPSEEK_API_KEY }}
          APROVAJA_IA_MODEL: deepseek-flash
        run: python vincular_gabaritos_ia.py

      - name: Buscar e extrair gabaritos oficiais sem API
        if: success()
        run: python buscar_gabaritos_web.py

      - name: Enviar candidatos ao Supabase (se configurado)
        if: success()
        env:
          APROVAJA_SUPABASE_URL: ${{ secrets.APROVAJA_SUPABASE_URL }}
          APROVAJA_IMPORT_SECRET: ${{ secrets.APROVAJA_IMPORT_SECRET }}
        run: |
          if [ -z "$APROVAJA_SUPABASE_URL" ]; then
            echo "::error::APROVAJA_SUPABASE_URL não configurada; o lote NÃO será enviado ao Supabase."
            exit 1
          fi
          if [ -z "$APROVAJA_IMPORT_SECRET" ]; then
            echo "::error::APROVAJA_IMPORT_SECRET não configurada; o lote NÃO será enviado ao Supabase."
            exit 1
          fi
          python publicar_questoes_supabase.py

      - name: Publicar arquivos leves para revisão
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aprovaja-revisao-${{ github.run_number }}
          path: |
            provas_data/revisao/questoes_candidatas.csv
            provas_data/revisao/questoes_candidatas.json
          if-no-files-found: warn
          retention-days: 30

      - name: Publicar PDFs originais separadamente
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aprovaja-pdfs-${{ github.run_number }}
          path: provas_data/originais/*.pdf
          if-no-files-found: warn
          retention-days: 30

      - name: Publicar JSON e mídias separadamente
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aprovaja-json-midias-${{ github.run_number }}
          path: |
            provas_data/json/**
            provas_data/midias/**
          if-no-files-found: warn
          retention-days: 30
