name: Pipeline independente de provas PDF

on:
  workflow_dispatch:
    inputs:
      max_downloads:
        description: "Máximo de PDFs processados nesta execução"
        required: true
        default: "5"
        type: string
  schedule:
    # Execução diária às 08:20 de Recife (11:20 UTC)
    - cron: "20 11 * * *"

permissions:
  contents: read

concurrency:
  group: pipeline-provas-pdf-json
  cancel-in-progress: false

jobs:
  coletar-e-converter:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-provas.txt

      - name: Instalar dependências
        run: python -m pip install -r requirements-provas.txt

      - name: Validar sintaxe
        run: python -m py_compile provas_pipeline.py segmentar_questoes_candidatas.py validar_pdf_prova.py publicar_questoes_supabase.py enriquecer_questoes_ia.py vincular_gabaritos_ia.py

      - name: Coletar PDFs, fazer triagem DeepSeek e gerar JSON multimodal
        env:
          DEEPSEEK_API_PUBLICA: ${{ secrets.DEEPSEEK_API_PUBLICA }}
          APROVAJA_IA_MODEL: deepseek-flash
        run: |
          if [ -z "$DEEPSEEK_API_PUBLICA" ]; then
            echo "::error::DEEPSEEK_API_PUBLICA está vazia ou indisponível para este workflow. Configure em Settings > Secrets and variables > Actions."
            exit 1
          fi
          python provas_pipeline.py --max-downloads "${{ inputs.max_downloads || '5' }}" --max-pages 100

      - name: Gerar lote de questões candidatas para revisão
        if: success()
        run: python segmentar_questoes_candidatas.py

      - name: Enriquecer questões com DeepSeek (se configurada)
        if: success()
        env:
          DEEPSEEK_API_PUBLICA: ${{ secrets.DEEPSEEK_API_PUBLICA }}
          APROVAJA_IA_MODEL: deepseek-flash
        run: python enriquecer_questoes_ia.py

      - name: Extrair e vincular gabaritos oficiais com DeepSeek (sem inferir respostas)
        if: success()
        env:
          DEEPSEEK_API_PUBLICA: ${{ secrets.DEEPSEEK_API_PUBLICA }}
          APROVAJA_IA_MODEL: deepseek-flash
        run: python vincular_gabaritos_ia.py

      - name: Enviar candidatos ao Supabase (se configurado)
        if: success()
        env:
          APROVAJA_SUPABASE_URL: ${{ secrets.APROVAJA_SUPABASE_URL }}
          APROVAJA_IMPORT_SECRET: ${{ secrets.APROVAJA_IMPORT_SECRET }}
        run: python publicar_questoes_supabase.py

      - name: Publicar arquivos leves para revisão
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aprovaja-revisao-${{ github.run_number }}
          path: |
            provas_data/revisao/questoes_candidatas.csv
            provas_data/revisao/questoes_candidatas.json
          if-no-files-found: warn
          retention-days: 30

      - name: Publicar PDFs originais separadamente
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aprovaja-pdfs-${{ github.run_number }}
          path: provas_data/originais/*.pdf
          if-no-files-found: warn
          retention-days: 30

      - name: Publicar JSON e mídias separadamente
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aprovaja-json-midias-${{ github.run_number }}
          path: |
            provas_data/json/**
            provas_data/midias/**
          if-no-files-found: warn
          retention-days: 30
