name: Teste do coletor CEBRASPE (sem Supabase)

on:
  workflow_dispatch:
    inputs:
      max_downloads:
        description: "Máximo de PDFs para testar"
        required: true
        default: "2"
        type: string

permissions:
  contents: read

concurrency:
  group: teste-coletor-cebraspe
  cancel-in-progress: false

jobs:
  testar-coletor:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-provas.txt

      - name: Instalar dependências
        run: python -m pip install -r requirements-provas.txt

      - name: Validar sintaxe dos scripts
        run: |
          python -m py_compile provas_pipeline.py validar_pdf_prova.py segmentar_questoes_candidatas.py

      - name: Executar coleta de teste
        run: python provas_pipeline.py --max-downloads "${{ inputs.max_downloads }}" --max-pages 40

      - name: Segmentar questões candidatas
        if: success()
        run: python segmentar_questoes_candidatas.py

      - name: Publicar artefatos para inspeção
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: teste-coletor-cebraspe-${{ github.run_number }}
          path: |
            provas_data/json/**
            provas_data/revisao/**
            provas_data/originais/*.pdf
          if-no-files-found: warn
          retention-days: 7
