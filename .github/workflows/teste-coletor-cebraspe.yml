name: Teste do coletor CEBRASPE (sem Supabase)

on:
  workflow_dispatch:
    inputs:
      max_downloads:
        description: "Máximo de PDFs para testar"
        required: true
        default: "2"
        type: string

permissions:
  contents: read

concurrency:
  group: teste-coletor-cebraspe
  cancel-in-progress: false

jobs:
  testar-coletor:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-provas.txt

      - name: Instalar dependências
        run: python -m pip install -r requirements-provas.txt

      - name: Validar sintaxe dos scripts
        run: |
          python -m py_compile provas_pipeline.py validar_pdf_prova.py segmentar_questoes_candidatas.py

      - name: Executar coleta de teste
        run: python provas_pipeline.py --max-downloads "${{ inputs.max_downloads }}" --max-pages 40

      - name: Segmentar questões candidatas
        if: success()
        run: python segmentar_questoes_candidatas.py

      - name: Diagnosticar arquivos produzidos pelo coletor
        if: always()
        run: |
          echo "CSV em data/:"
          if [ -d data ]; then find data -maxdepth 3 -type f -iname '*.csv' -printf '%p (%s bytes)\\n' | sort; else echo 'Pasta data/ não existe.'; fi
          echo "Arquivos em provas_data/:"
          if [ -d provas_data ]; then find provas_data -maxdepth 4 -type f -printf '%p (%s bytes)\\n' | sort | head -300; else echo 'Pasta provas_data/ não existe.'; fi
          for d in provas_data/originais provas_data/json provas_data/revisao; do
            if [ -d "$d" ]; then echo "$d: $(find "$d" -type f | wc -l) arquivo(s)"; else echo "$d: ausente"; fi
          done

      - name: Publicar artefatos para inspeção
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: teste-coletor-cebraspe-${{ github.run_number }}
          path: |
            provas_data/json/**
            provas_data/revisao/**
            provas_data/originais/*.pdf
          if-no-files-found: warn
          retention-days: 7
