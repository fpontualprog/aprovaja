name: Varredura experimental de concursos (somente leitura)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  varrer:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v7
      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Instalar dependências
        run: python -m pip install requests beautifulsoup4
      - name: Testar regras e sintaxe antes da coleta
        run: |
          python -m py_compile varredura_experimental.py validar_candidatos_concursos.py test_validar_candidatos_concursos.py
          python -m unittest -v test_validar_candidatos_concursos.py
      - name: Executar descoberta experimental
        run: python varredura_experimental.py
      - name: Deduplicar e procurar links oficiais candidatos
        run: python validar_candidatos_concursos.py
      - name: Disponibilizar resultados para análise
        uses: actions/upload-artifact@v4
        with:
          name: varredura-experimental-concursos
          path: varredura_experimental_resultados/
          if-no-files-found: error
          retention-days: 14
